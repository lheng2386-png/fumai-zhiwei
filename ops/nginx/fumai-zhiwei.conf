server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/fumai-zhiwei/frontend/current/dist;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location = /deployment.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Replace this location with the agreed backend reverse proxy only after
    # the backend service has its own passing health check.
    location /api/ {
        default_type application/json;
        return 503 '{"status":"not_connected","message":"Backend is not deployed"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
