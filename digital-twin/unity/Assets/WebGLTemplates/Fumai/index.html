<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伏脉 · Unity 三维电站</title>
<style>
*{box-sizing:border-box}body{margin:0;font:13px/1.7 system-ui,"Microsoft YaHei",sans-serif;background:#e7ece5;color:#214837}button,select,input{font:inherit}button,select{border:1px solid #ccd8c8;border-radius:7px;padding:7px 12px;background:#fff;color:#31533c;cursor:pointer}button:hover{background:#ebf2e5}header{height:55px;display:flex;align-items:center;gap:8px;padding:8px 15px;background:#f9fcf5;border-bottom:1px solid #d5dfce;flex-wrap:wrap}header strong{margin-right:auto;letter-spacing:1px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;height:calc(100dvh - 55px)}.viewport{position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.source{position:absolute;left:18px;bottom:15px;padding:7px 12px;background:#f9fcf2e8;border:1px solid #d8dfcd;border-radius:6px;font-size:10px;pointer-events:none}.instructions{position:absolute;top:15px;left:18px;color:#395141;font-size:11px;text-shadow:0 1px 2px #fff;pointer-events:none}aside{background:#fbfdf8;border-left:1px solid #d5dfce;display:flex;flex-direction:column;overflow:hidden}aside h2{font-size:15px;margin:15px 15px 9px}aside input{margin:0 15px 9px;width:calc(100% - 30px);padding:8px;border:1px solid #d5dfce;border-radius:5px}.assets{max-height:35%;overflow:auto;padding:0 10px}.assets button{display:flex;width:100%;text-align:left;font-size:11px;margin:3px 0;border:0;background:transparent}.assets button[aria-pressed=true]{background:#e0ecd8}.assets i{height:7px;width:7px;border-radius:50%;margin:6px 8px 0 0;background:#8aa27b}.assets i.alert{background:#c34339}.details{border-top:1px solid #e2e8dd;padding:16px;overflow:auto;margin-top:10px;flex:1}.details h3{margin:0 0 8px;font-size:15px}.details dl{margin:10px 0;font-size:11px}.details dt{color:#8b9b80;font-size:10px}.details dd{margin:3px 0 13px;color:#3a5d3c}.details button{display:block;width:100%;margin:7px 0;font-size:11px}.status{position:absolute;inset:0;background:linear-gradient(#dbe6e3,#f4f7ed);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:30px;text-align:center}.status[hidden]{display:none}.status progress{width:220px;accent-color:#315e45}.status p{font-size:11px;color:#708367}small{font-size:10px;color:#8b9b80}@media(max-width:700px){header{height:auto;min-height:55px;gap:5px;padding:8px}header strong{font-size:11px;width:100%;margin:0}header button,header select{font-size:10px;padding:5px 7px}.layout{height:calc(100dvh - 100px);grid-template-columns:1fr 180px}aside h2{font-size:12px}.details{padding:10px}.source{left:8px;bottom:8px;max-width:90%;font-size:9px}.instructions{left:8px;font-size:9px}}
@media(max-width:700px){.layout{grid-template-columns:1fr;height:auto}.viewport{height:58dvh;min-height:320px}aside{max-height:350px;min-height:240px;display:grid;grid-template-columns:140px minmax(0,1fr)}aside h2{grid-column:1/-1}aside input{grid-column:1}.assets{grid-column:1;max-height:240px}.details{grid-column:2;grid-row:2/4;margin-top:0;border-top:0;border-left:1px solid #e2e8dd;max-height:270px}}
</style></head>
<body><header><strong>伏脉 · 空间监控</strong><button data-view="overview">全站</button><button data-view="walk">低视角</button><button data-view="top">俯视</button><button data-view="focus">设备近览</button><select id="light" aria-label="光照"><option value="day">日间</option><option value="dusk">傍晚</option></select><select id="quality" aria-label="画质"><option value="standard">标准画质</option><option value="low">低功耗</option></select><button id="fullscreen">全屏</button></header>
<div class="layout"><div class="viewport"><canvas id="unity-canvas" tabindex="0" aria-label="Unity 三维电站"></canvas><div class="instructions">拖动旋转 · 右键平移 · 滚轮缩放 · 双指缩放</div><div class="source">尺寸示意 · 非测绘成果 · Unity WebGL / Wasm</div><div class="status" id="status"><strong>正在加载 Unity 三维场景</strong><progress id="progress" value="0" max="1"></progress><p>模型、光照和交互由 Unity 执行。<br>首次加载需要下载原生 WebGL/Wasm 资源。</p></div></div><aside><h2>设备与监控</h2><input id="search" aria-label="搜索设备" placeholder="输入设备编号"><div class="assets" id="assets"></div><section class="details" id="details"><p>从场景或列表中选择设备</p><small>实测参数未接入时保留未知，不使用模拟电压或温度填充。</small></section></aside></div>
<script>
'use strict';
const canvas=document.getElementById('unity-canvas'),statusEl=document.getElementById('status'),catalog=[],monitor=new Map();
let instance=null,selected='',ready=false,disposed=false;
const send=(method,value='')=>{if(instance&&ready&&!disposed)instance.SendMessage('FumaiBridge',method,value);};
const emit=event=>{if(parent!==window)parent.postMessage({schema:'fumai-unity-v1',...event},location.origin);};
const render=()=>{
 const query=document.getElementById('search').value.toLowerCase();const host=document.getElementById('assets');host.replaceChildren();
 const assets=catalog.filter(a=>(a.id+' '+a.type).includes(query)).sort((a,b)=>({inverter:0,transformer:1,panel:2}[a.type]-{inverter:0,transformer:1,panel:2}[b.type]));
 for(const asset of assets.slice(0,100)){const button=document.createElement('button'),dot=document.createElement('i');const value=monitor.get(asset.id);dot.className=value&&['unreviewed','needs_investigation'].includes(value.state)?'alert':'';button.append(dot,document.createTextNode(asset.id));button.setAttribute('aria-pressed',String(asset.id===selected));button.onclick=()=>send('SelectAsset',asset.id);host.append(button);}
 const asset=catalog.find(a=>a.id===selected);if(!asset)return;const detail=document.getElementById('details');detail.replaceChildren();const h=document.createElement('h3');h.textContent=asset.id;detail.append(h);const list=document.createElement('dl');
 const row=(key,value)=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;list.append(dt,dd);};
 row('设备类型',{panel:'光伏组件',inverter:'逆变器',transformer:'箱式变压器'}[asset.type]||asset.type);row('示意坐标 / m',asset.position.map(n=>n.toFixed(2)).join(' / '));row('坐标来源','构造布局 / 待图纸与勘测校核');
 const value=monitor.get(asset.id);row('业务状态',value?(['unreviewed','needs_investigation'].includes(value.state)?'候选事件待核查':'已挂接样例记录'):'未接入');
 row('样例实测功率',value?.has_actual_kw?value.actual_kw.toFixed(1)+' kW':'未知');row('样例同时刻参考',value?.has_reference_kw?value.reference_kw.toFixed(1)+' kW':'未知');detail.append(list);
 for(const [label,type] of [['查看关联证据 ↗','evidence'],['向智能体追问 ↗','agent']]){const button=document.createElement('button');button.textContent=label;button.onclick=()=>emit({type,id:asset.id});detail.append(button);}
 const note=document.createElement('small');note.textContent='模型精细度不等于工程精度；当前没有经现场确认的故障结论。';detail.append(note);
};
window.fumaiUnityEvent=text=>{
 if(disposed)return;
 let event;try{event=JSON.parse(text);}catch{return;}
 if(event.type==='ready'){ready=true;statusEl.hidden=true;emit(event);}
 else if(event.type==='monitoring'&&Array.isArray(event.values)){monitor.clear();for(const value of event.values)monitor.set(value.id,value);render();}
 else if(typeof event.id==='string'&&/^[A-Za-z0-9_-]{1,64}$/.test(event.id)){selected=event.id;render();emit({...event,type:'selected',asset_type:event.type});}
};
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.schema!=='fumai-unity-v1')return;const data=event.data;
 if(data.type==='select'&&/^[A-Za-z0-9_-]{1,64}$/.test(data.id||''))send('SelectAsset',data.id);
 if(data.type==='monitoring'&&typeof data.payload==='string'&&data.payload.length<131072)send('ApplyMonitoring',data.payload);
 if(data.type==='dispose'){disposed=true;instance?.Quit();}
});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>send('View',b.dataset.view));document.getElementById('light').onchange=e=>send('Lighting',e.target.value);document.getElementById('quality').onchange=e=>send('Quality',e.target.value);document.getElementById('search').oninput=render;document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();
const points=new Map();let down=null;
canvas.oncontextmenu=event=>event.preventDefault();
canvas.onpointerdown=event=>{canvas.setPointerCapture(event.pointerId);points.set(event.pointerId,{x:event.clientX,y:event.clientY});down={x:event.clientX,y:event.clientY,moved:false};};
canvas.onpointermove=event=>{const old=points.get(event.pointerId);if(!old)return;const dx=event.clientX-old.x,dy=event.clientY-old.y;if(down&&Math.hypot(event.clientX-down.x,event.clientY-down.y)>5)down.moved=true;
 if(points.size===2){const other=[...points.entries()].find(([id])=>id!==event.pointerId)?.[1];if(other){const before=Math.hypot(old.x-other.x,old.y-other.y),after=Math.hypot(event.clientX-other.x,event.clientY-other.y);send('Zoom',String((before-after)*2));}}
 else if(points.size===1&&event.buttons)send(event.buttons===2?'Pan':'Orbit',JSON.stringify({x:dx,y:dy}));points.set(event.pointerId,{x:event.clientX,y:event.clientY});};
canvas.onpointerup=event=>{if(points.size===1&&down&&!down.moved&&event.button===0){const rect=canvas.getBoundingClientRect();send('PickAt',JSON.stringify({x:(event.clientX-rect.left)/rect.width,y:(event.clientY-rect.top)/rect.height}));}points.delete(event.pointerId);down=null;};canvas.onpointercancel=event=>{points.delete(event.pointerId);down=null;};
canvas.addEventListener('wheel',event=>{event.preventDefault();send('Zoom',String(event.deltaY));},{passive:false});
fetch('StreamingAssets/plant-layout.json').then(r=>{if(!r.ok)throw Error('设备索引未能加载');return r.json();}).then(data=>{catalog.push(...data.assets);render();}).catch(error=>{document.getElementById('details').textContent=error.message;});
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',devicePixelRatio:Math.min(devicePixelRatio||1,1.5),companyName:'Fumai',productName:'Fumai Native Scene',productVersion:'1.0'},progress=>{document.getElementById('progress').value=progress;}).then(value=>{if(disposed){value.Quit();return;}instance=value;}).catch(error=>{statusEl.querySelector('strong').textContent='Unity 场景加载失败';statusEl.querySelector('p').textContent=String(error);});script.onerror=()=>{statusEl.querySelector('strong').textContent='Unity 构建资源不可用';statusEl.querySelector('p').textContent='请核对完整的 WebGL 发布目录，不能用脚本工程代替构建产物。';};document.body.append(script);
window.addEventListener('pagehide',()=>{disposed=true;instance?.Quit();});
</script></body></html>
